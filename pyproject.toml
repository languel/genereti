[project]
name = "genereti"
version = "0.1.2"
description = "EARLY ALPHA - experimental classroom release. Experimental realtime live creative tools for ComfyUI: code (p5js,glsl), drawing, shaders, 2d operators, web audio, MIDI, lessons and performance timelines. Expect bugs and changing interfaces; back up workflows."
requires-python = ">=3.11"
dependencies = ["comfyui-frontend-package>=1.53.6"]
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/languel/genereti"
Documentation = "https://github.com/languel/genereti/blob/main/docs/comfy-distribution.md"
"Bug Tracker" = "https://github.com/languel/genereti/issues"

[tool.comfy]
PublisherId = "liuboto"
DisplayName = "ꘇ Genereti"
Icon = "https://raw.githubusercontent.com/languel/genereti/main/docs/branding/genereti-mark.svg"
requires-comfyui = ">=0.38.2"

[project]
name = "genereti"
version = "0.1.1"
description = "SUPER ALPHA - early classroom test release. Experimental live creative tools for ComfyUI: code, drawing, OpenTouch TOP/CHOP/DAT operators, Web Audio, lessons and performance timelines. Expect bugs and changing interfaces; back up workflows."
requires-python = ">=3.11"
dependencies = ["comfyui-frontend-package>=1.53.6"]
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/languel/genereti"
Documentation = "https://github.com/languel/genereti/blob/main/docs/comfy-distribution.md"
"Bug Tracker" = "https://github.com/languel/genereti/issues"

[tool.comfy]
PublisherId = "liuboto"
DisplayName = "ꘇ Genereti · OpenTouch"
Icon = "https://raw.githubusercontent.com/languel/genereti/main/docs/branding/genereti-mark.svg"
requires-comfyui = ">=0.38.2"

[project]
name = "genereti"
version = "0.1.0"
description = "Live creative tools for ComfyUI: code, drawing, OpenTouch TOP/CHOP/DAT operators, Web Audio, lessons and performance timelines."
requires-python = ">=3.11"
dependencies = ["comfyui-frontend-package>=1.53.6"]
license = { file = "LICENSE" }

[project.urls]
Repository = "https://github.com/languel/genereti"
Documentation = "https://github.com/languel/genereti/blob/main/docs/comfy-distribution.md"
"Bug Tracker" = "https://github.com/languel/genereti/issues"

[tool.comfy]
PublisherId = "liuboto"
DisplayName = "ꘇ Genereti · OpenTouch"
requires-comfyui = ">=0.38.2"

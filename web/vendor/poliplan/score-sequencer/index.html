<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score sequencer</title>
<style>
  :root { color-scheme: light dark; --bg: #f3efe6; --fg: #2b2a27; --mute: #7a766c; --accent: #c8664f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1b1b; --fg: #e8e4da; --mute: #9a968c; --accent: #d9826b; } }
  :root[data-theme="dark"] { --bg: #1b1b1b; --fg: #e8e4da; --mute: #9a968c; --accent: #d9826b; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #stage { width: 100%; height: auto; aspect-ratio: 4 / 3; background: #fbf8f1; border-radius: 6px; }
  :root[data-theme="dark"] #stage, :root:not([data-theme="light"]) #stage { background: #232323; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  button, select { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--mute); background: transparent; color: var(--fg); }
  input[type=range] { flex: 1; min-width: 120px; }
  #clock { font-variant-numeric: tabular-nums; min-width: 6em; }
  #blurb { color: var(--fg); } #listen { color: var(--mute); }
  pre { background: transparent; color: var(--mute); font-size: 12px; margin: 8px 0 0; white-space: pre; }
  .note { color: var(--mute); font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Score sequencer</h1>
  <canvas id="stage" width="800" height="600"></canvas>
  <div class="row">
    <button id="play">Play</button>
    <button id="rewind" title="Back to the start">⏮</button>
    <span id="clock">0.00 s</span>
    <input id="scrub" type="range" min="0" max="16" step="0.01" value="0" aria-label="Position">
  </div>
  <div class="row">
    <select id="example" aria-label="Score"></select>
    <label>Speed <input id="rate" type="range" min="0.25" max="2" step="0.05" value="1"> <span id="rate-out">1.00×</span></label>
    <label><input id="midi" type="checkbox"> MIDI out</label> <span id="midi-status" class="note"></span>
  </div>
  <p id="blurb"></p>
  <p id="listen" class="note"></p>
  <pre id="signals" aria-label="Signals"></pre>
  <p class="note">Sound: the built-in General MIDI synth (loads on the first Play). Each example is a plain score: the same JSON the editor exports.</p>
</main>
<script type="module" src="./sequencer.js"></script>
</body>
</html>

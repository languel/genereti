name: Comfy package checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install browser test dependencies
        run: npm ci --ignore-scripts
      - name: Browser and distribution tests
        run: |
          python -m pip install pathspec
          node --test tests/*.mjs
          python -m unittest discover -s tests -p test_comfy_package.py
          python -m unittest discover -s tests -p test_comfy_workflow_install.py
      - name: Build student ZIP from checked-in browser bundles
        run: python scripts/build_comfy_package.py --output artifacts/comfy-package
      - uses: actions/upload-artifact@v4
        with:
          name: genereti-comfy-preview
          path: artifacts/comfy-package/
          retention-days: 14

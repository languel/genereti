<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genereti Projector</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; color: #fff; font: 14px system-ui, sans-serif; }
    body { display: grid; place-items: center; overflow: hidden; }
    #image { display: block; width: 100vw; height: 100vh; object-fit: contain; }
    #message { position: fixed; inset: 0; display: grid; place-items: center; color: #aaa; }
#controls{position:fixed;right:0;bottom:0;padding:16px;width:80px;height:80px;display:flex;align-items:flex-end;justify-content:flex-end;z-index:2}#fullscreen{width:36px;height:36px;padding:9px;border:1px solid #ffffff30;border-radius:6px;background:#202020cc;color:#ddd;cursor:pointer;opacity:0;transition:opacity .18s;display:grid;place-items:center}#fullscreen svg{width:16px;height:16px}#controls:hover #fullscreen,#controls:focus-within #fullscreen{opacity:1}#fullscreen:focus-visible{outline:2px solid #aaa;outline-offset:2px}@media(hover:none){#fullscreen{opacity:.6}}
  </style>
</head>
<body>
  <div id="message">Open this window from the Genereti Projector node, then queue an image.</div>
  <img id="image" alt="ComfyUI projector output" hidden>
  <div id="controls"><button id="fullscreen" type="button" aria-label="Toggle fullscreen" title="Fullscreen (F) · Esc to exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button></div>
  <script>
    const image = document.querySelector('#image');
    const message = document.querySelector('#message');
    window.addEventListener('message', (event) => {
      if (event.origin !== window.location.origin || event.data?.type !== 'genereti-projector-image') return;
      image.src = event.data.src;
      image.hidden = false;
      message.hidden = true;
    });
    document.querySelector('#fullscreen').addEventListener('click', async () => {
      if (!document.fullscreenElement) await document.documentElement.requestFullscreen?.();
      else await document.exitFullscreen?.();
    });
    document.addEventListener('fullscreenchange', () => {
      document.querySelector('#fullscreen').title = document.fullscreenElement ? 'Exit fullscreen (F / Esc)' : 'Fullscreen (F)';
    });
document.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='f'&&!event.repeat&&!event.metaKey&&!event.ctrlKey&&!event.altKey){event.preventDefault();document.getElementById('fullscreen').click();}});
    window.opener?.postMessage({ type: 'genereti-projector-ready' }, window.location.origin);
  </script>
</body>
</html>

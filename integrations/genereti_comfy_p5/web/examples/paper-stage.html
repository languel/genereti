<!doctype html><html><head><title>Paper stage</title><style>
body{margin:0;background:#10151e;color:#eee;font-family:system-ui}button{font:inherit;color:inherit;background:#283344;border:0;border-radius:6px;padding:6px 10px}canvas{display:block;width:100%;height:240px}header{padding:12px}#status{margin-left:8px}
</style></head><body><header><strong>Paper stage</strong> <button id="sound">Start sound</button><span id="status">Audio starts only when you click.</span></header><canvas id="stage" width="640" height="360" aria-label="Interactive paper stage"></canvas><p>Move over the stage to change its light and tone. Raw preserves this source; Rendered runs it.</p><script>
const canvas=document.querySelector('#stage'),ctx=canvas.getContext('2d');let pointer=.5,audio,osc,gain,active=false;window.startedAt=performance.now();window.draws=0;
canvas.onpointermove=e=>{pointer=(e.clientX-canvas.getBoundingClientRect().left)/canvas.getBoundingClientRect().width;if(osc)osc.frequency.setTargetAtTime(130+pointer*390,audio.currentTime,.05)};
document.querySelector('#sound').onclick=async()=>{audio??=new AudioContext();await audio.resume();if(!osc){osc=audio.createOscillator();gain=audio.createGain();gain.gain.value=0;osc.type='sine';osc.connect(gain).connect(audio.destination);osc.start()}active=!active;gain.gain.setTargetAtTime(active?.06:0,audio.currentTime,.03);document.querySelector('#sound').textContent=active?'Mute sound':'Start sound';document.querySelector('#status').textContent=active?'Sound running · move on stage':'Muted';};
function draw(now){window.draws++;ctx.fillStyle='#10151e';ctx.fillRect(0,0,640,360);for(let i=0;i<8;i++){ctx.save();ctx.translate(70+i*70,180+Math.sin(now*.001+i)*55);ctx.rotate(Math.sin(now*.0006+i)*.4);ctx.fillStyle=i%2?'#e5763b':'#315eca';ctx.globalAlpha=.35+pointer*.6;ctx.beginPath();ctx.moveTo(-40,70);ctx.lineTo(0,-80);ctx.lineTo(40,70);ctx.closePath();ctx.fill();ctx.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>

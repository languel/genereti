<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genereti · p5 canvas lab</title><link rel="icon" href="/favicon.svg"><script src="./vendor/p5.min.js"></script><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#151618;color:#e6e7e9;font:13px system-ui}main{max-width:1100px;margin:auto;padding:18px}header,.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}h1{font-size:17px;margin:0 auto 0 0}button,input,select,textarea{font:inherit;color:inherit;background:#27292d;border:1px solid #484b51;border-radius:5px;padding:7px}button{cursor:pointer}button:disabled{opacity:.5}textarea{flex:1;min-width:220px}input[type=number]{width:80px}#server{width:210px}.streams{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stream{min-width:0}.canvas-host{aspect-ratio:1;background:white;touch-action:none}.canvas-host canvas{display:block;width:100%!important;height:100%!important}h2{font-size:13px;margin:8px 0}.tools{margin-top:10px}label{display:flex;gap:6px;align-items:center}#status{min-height:20px;color:#b4b8c1}#status.error{color:#ffb3a5}a{color:inherit}footer{margin-top:15px;color:#9ba0aa}#metrics{font-variant-numeric:tabular-nums;margin-left:auto}@media(max-width:650px){.streams{grid-template-columns:1fr}main{padding:10px}}
</style></head><body><main><header><h1>Genereti × p5.js</h1><input id="server" aria-label="Genereti server" value="http://127.0.0.1:8765"><button id="connect">Connect · 512</button><button id="live" disabled>Start live</button><span id="metrics"></span></header>
<div class="tools"><textarea id="prompt" rows="2" aria-label="Prompt">ink wash 水墨画</textarea><button id="apply">Apply ⌘↵</button><label><input id="livePrompt" type="checkbox">Live prompt</label><label>Guide<input id="control" type="number" min="0" max="65504" step=".05" value="1"></label><label>Seed<input id="seed" type="number" min="0" max="4294967295" value="42"></label></div>
<div class="streams"><section class="stream"><h2>Input · send</h2><div id="inputCanvas" class="canvas-host"></div><div class="tools"><label>Brush<input id="brush" type="number" min="1" max="80" value="6"></label><label>Color<input id="ink" type="color" value="#111111"></label><button id="clearInput">Clear</button><button id="example">Example</button><button id="once" disabled>Send frame</button></div></section>
<section class="stream"><h2>Output · receive + draw</h2><div id="outputCanvas" class="canvas-host"></div><div class="tools"><select id="effect" aria-label="Output processing"><option value="plain">Original</option><option value="gray">Grayscale</option><option value="threshold">Threshold</option><option value="posterize">Posterize</option></select><button id="clearOutput">Clear marks</button><button id="receive">Receive latest</button><button id="outputToInput">Output → input</button><label title="Feed each generated frame, including effects and marks, into the next request"><input id="feedback" type="checkbox">Continuous output → input</label></div></section></div>
<div class="tools"><button id="saveState">Save canvas state</button><button id="loadState">Open canvas state</button><input id="stateFile" type="file" accept="application/json,.json" hidden><button id="saveImage">Save output PNG</button><a href="/p5.html">Output stage</a></div><div id="status" role="status">Connect to load SDXS sketch at 512 × 512.</div><footer>Draw on either canvas · right-click erases · Cmd/Ctrl+Enter applies prompt · only input is sent to generation</footer></main><script type="module" src="./p5-lab.js"></script></body></html>
